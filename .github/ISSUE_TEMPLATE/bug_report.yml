name: Bug report
description: Report incorrect parsing, rendering, diagnostics, or extension behavior.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps and a minimal synthetic fixture when possible.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CertView version
      placeholder: "0.3.6"
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: File format
      options:
        - PEM
        - DER
        - CRT/CER
        - PKCS#7/P7B
        - PKCS#12/PFX
        - CSR
        - CRL
        - KEY/PUB
        - JWK
        - Other
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data safety
      description: Confirm that attached files are synthetic or sanitized. Do not upload private keys or production/customer certificates.
    validations:
      required: true
