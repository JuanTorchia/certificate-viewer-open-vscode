name: Question or support
description: Ask usage, compatibility, or troubleshooting questions.
title: "[Support]: "
labels: ["question", "triage"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include VS Code version, CertView version, file format, and any non-sensitive details.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I will not attach private keys, production certificates, customer certificates, tokens, passwords, or proprietary PKI material.
          required: true
