name: CI & Publish

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm compile

      - name: Lint
        run: pnpm lint

      - name: Unit Tests (no Electron)
        run: node ./out/test/unit/index.js

      - name: Integration Tests (Electron)
        run: xvfb-run -a pnpm test

      - name: Package VSIX
        run: pnpm package

      - name: Audit VSIX contents
        run: pnpm package:audit

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: certview-vsix
          path: certview-*.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Marketplace
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package VSIX
        run: pnpm package

      - name: Audit VSIX contents
        run: pnpm package:audit

      - name: Publish
        run: |
          if output=$(npx --yes @vscode/vsce publish --no-dependencies 2>&1); then
            echo "$output"
          else
            echo "$output"
            if ! echo "$output" | grep -q "already exists"; then
              exit 1
            fi
            echo "Version already published — skipping."
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
