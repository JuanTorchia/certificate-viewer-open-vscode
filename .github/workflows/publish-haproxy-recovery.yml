name: Publish HAProxy 0.4.0 recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the immutable HAProxy release tag
        uses: actions/checkout@v7
        with:
          repository: JuanTorchia/gmm-haproxy-vscode
          ref: v0.4.0
          path: haproxy

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: haproxy/package-lock.json

      - name: Install root dependencies
        working-directory: haproxy
        run: npm ci

      - name: Install client dependencies
        working-directory: haproxy
        run: npm ci --legacy-peer-deps --prefix client

      - name: Install server dependencies
        working-directory: haproxy
        run: npm ci --legacy-peer-deps --prefix server

      - name: Build bundles
        working-directory: haproxy
        run: npm run build

      - name: Package and inspect extension
        working-directory: haproxy
        run: |
          npx vsce package --no-dependencies
          npm run package:check

      - name: Publish HAProxy Config 0.4.0
        working-directory: haproxy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --no-dependencies
