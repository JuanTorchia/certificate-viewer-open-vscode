name: Publish to Open VSX

# Separate from the Marketplace workflow so an Open VSX outage never blocks a
# Marketplace release. Manual runs publish an existing tag (backfills).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.5.0)
        required: true

permissions:
  contents: read
  # OIDC token for Open VSX trusted publishing; no long-lived secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and run unit tests
        run: |
          pnpm compile
          node ./out/test/unit/index.js

      - name: Package VSIX
        run: pnpm package

      - name: Audit VSIX contents
        run: pnpm package:audit

      - name: Publish
        run: npx --yes ovsx@1.2.0 publish --trusted-publishing --packagePath ./*.vsix --skip-duplicate
